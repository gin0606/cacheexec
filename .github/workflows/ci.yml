name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  nix:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix flake check --print-build-logs
      # Rosetta makes this the slowest CI step, so it runs only on main, which
      # verifies every merge; a release tag points at a commit main already ran.
      # Pull requests and other branches (see the push filter above) skip it.
      - if: matrix.os == 'macos-15' && github.ref == 'refs/heads/main'
        run: nix build .#packages.x86_64-darwin.default --no-link --print-build-logs
