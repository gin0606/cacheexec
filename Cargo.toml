[package]
name = "cacheexec"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Cache non-interactive command output and exit status"
license = "MIT"
repository = "https://github.com/gin0606/cacheexec"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
libc = "0.2"
sha2 = "0.10"
tempfile = "3"
